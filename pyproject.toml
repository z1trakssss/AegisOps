[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegisops-orders-api"
version = "0.1.0"
description = "Demo workload for the AegisOps DevSecOps and SRE platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-sdk>=1.39,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app/orders_api"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-markers --cov=app/orders_api --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
