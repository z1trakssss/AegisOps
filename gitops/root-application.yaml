apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegisops-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/z1trakssss/AegisOps.git
    targetRevision: main
    path: gitops/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
