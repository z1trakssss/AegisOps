replicaCount: 3

image:
  repository: ghcr.io/z1trakssss/aegisops-orders-api
  tag: "0.1.0"

config:
  logLevel: INFO
  faultMode: none
  otelEndpoint: http://otel-collector-opentelemetry-collector.monitoring.svc:4317

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: true
  labels:
    release: monitoring

prometheusRule:
  enabled: true
  labels:
    release: monitoring
