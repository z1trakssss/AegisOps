apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: aegisops-require-standard-labels
  annotations:
    policies.kyverno.io/title: Require application ownership labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: aegisops-namespaces
      expression: object.metadata.namespace.startsWith('aegisops-')
  validations:
    - message: app.kubernetes.io/name and app.kubernetes.io/part-of labels are required.
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        'app.kubernetes.io/part-of' in object.metadata.labels

