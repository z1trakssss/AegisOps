apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: aegisops-verify-signed-images
  annotations:
    policies.kyverno.io/title: Verify AegisOps image signatures
    policies.kyverno.io/category: Software Supply Chain
    policies.kyverno.io/severity: high
spec:
  # Start in Audit mode. Change this to Deny after publishing the first signed release.
  validationActions:
    - Audit
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: ghcr.io/z1trakssss/aegisops-orders-api:*
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  attestors:
    - name: githubRelease
      cosign:
        keyless:
          identities:
            - subjectRegExp: '^https://github\.com/z1trakssss/AegisOps/\.github/workflows/release\.yml@refs/tags/v.*$'
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image,
          verifyImageSignatures(image, [attestors.githubRelease])).all(result, result > 0)
      message: AegisOps images must be signed by the release workflow.

