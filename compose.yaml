services:
  orders-api:
    build:
      context: .
    image: aegisops/orders-api:dev
    ports:
      - "8080:8080"
    environment:
      AEGIS_LOG_LEVEL: INFO
      AEGIS_FAULT_MODE: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

